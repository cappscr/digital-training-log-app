[build]
builder = "railpack"
# This ensures Railway only builds when files in /backend change
watchPatterns = ["backend/**"]

[deploy]
# Schema only. This runs before the new container starts.
preDeployCommand = "bin/rails db:prepare"

# Backfill in the new image, then serve. data:migrate no-ops once recorded.
startCommand = "bin/rails data:migrate && bin/rails server -b 0.0.0.0"

# Highly recommended: Railway will wait for this to return 200 before switching traffic
healthcheckPath = "/up" 
healthcheckTimeout = 300