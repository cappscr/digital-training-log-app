[build]
builder = "railpack"
# This ensures Railway only builds when files in /backend change
watchPatterns = ["backend/**"]

[deploy]
# Schema and data migrations. This container must exit before the server starts.
preDeployCommand = "bin/release"

# The healthcheck targets this process, so it has to be the server.
startCommand = "bin/rails server -b 0.0.0.0"

# Highly recommended: Railway will wait for this to return 200 before switching traffic
healthcheckPath = "/up" 
healthcheckTimeout = 300