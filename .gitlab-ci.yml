# Define stages for the pipeline
stages:
  - ci
  - deploy

# Use the official Ruby 4.0.1 image
image: ruby:4.0.1

# Backend CI
backend_ci:
  stage: ci
  variables:
    RAILS_ENV: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/**/*
  before_script:
    - apt-get update -qq && apt-get install -y libsqlite3-dev
    - cd backend
    - bundle install
    - bin/rails db:test:prepare
  script:
    - bin/ci

# Frontend CI
frontend_ci:
  stage: ci
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/**/*
  variables:
    COREPACK_HOME: "${CI_PROJECT_DIR}/.corepack"
  script:
    - apk add --no-cache libc6-compat bash
    - npm install -g corepack --force
    - corepack enable
    - corepack prepare yarn@4.12.0 --activate

    - cd frontend
    - yarn install --immutable

    - echo "***** Running linter *****"
    - yarn lint
    - echo "***** Linting passed *****"
    - echo "***** Running type checker *****"
    - yarn types
    - echo "***** Type check passed *****"
    - echo "***** Running unit tests *****"
    - yarn test --run
    - echo "***** Unit tests passed *****"

# Deploy the Rails app to Railway
backend_deploy:
  stage: deploy
  image: ghcr.io/railwayapp/cli:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - backend/**/*
        - .gitlab-ci.yml
        - railway.toml
  script:
    - railway up --service digital-training-log-api --ci

# Deploy the React app to Netlify
frontend_deploy:
  stage: deploy
  image: node:22-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
        - netlify.toml
  variables:
    COREPACK_HOME: "${CI_PROJECT_DIR}/.corepack"
  script:
    - apk add --no-cache libc6-compat bash
    - npm install -g corepack --force
    - corepack enable
    - corepack prepare yarn@4.12.0 --activate

    - npm install -g netlify-cli

    - cd frontend
    - yarn install --immutable

    - netlify deploy --site $NETLIFY_SITE_ID --auth $NETLIFY_AUTH_TOKEN --prod --dir=dist
